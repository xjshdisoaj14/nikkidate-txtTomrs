name: Build Nikki MRS Ruleset

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Step 1 - Fetch & Strictly Clean to High-Performance TXT
        run: python convert.py

      - name: Install Mihomo CLI Engine
        run: |
          MIHOMO_TAG=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r .tag_name)
          curl -L -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_TAG}/mihomo-linux-amd64-${MIHOMO_TAG}.gz"
          gunzip mihomo.gz
          chmod +x mihomo

      - name: Step 2 & 3 - Compile MRS Binary and Reverse-Export to YAML
        run: |
          # 1. 生成 Nikki 极速识别二进制文件
          ./mihomo convert-ruleset domain yaml rules_input.yaml adblock.mrs

          # 2. 从二进制逆向解包导出标准 rules.yaml
          ./mihomo convert-ruleset domain mrs adblock.mrs rules.yaml

      - name: Deploy Output Files to Publish Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir /tmp/output
          cp rules.txt /tmp/output/rules.txt
          cp adblock.mrs /tmp/output/adblock.mrs
          cp rules.yaml /tmp/output/rules.yaml

          git checkout --orphan publish || git checkout publish
          git rm -rf .

          cp /tmp/output/* ./
          git add rules.txt adblock.mrs rules.yaml
          git commit -m "Auto update clean rulesets: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || exit 0
          git push -f origin publish
